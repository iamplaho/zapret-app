name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Версия сборки: $v"

      - name: Write build version file
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("zapret_app/_build_version.py", "VERSION = '$env:VERSION'`n")

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build app (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean zapret-app.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:VERSION" "installer\zapret-app.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }
          Get-ChildItem installer-output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zapret-app-setup-${{ env.VERSION }}
          path: installer-output/*.exe

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*.exe
