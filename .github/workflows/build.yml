name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build app (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean zapret-app.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '0.2.0-dev'
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "installer\zapret-app.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }
          Get-ChildItem installer-output
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Pack portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/zapret-app/* -DestinationPath "zapret-app-portable-$env:VERSION.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zapret-app-${{ env.VERSION }}
          path: |
            installer-output/*.exe
            zapret-app-portable-*.zip

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/*.exe
            zapret-app-portable-*.zip
